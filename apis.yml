    type: Documentation
  - url: https://goldrush.dev/docs/api-reference/hyperliquid/websocket-api/l4-order-book
    type: Documentation
  description: >-
    WebSocket channels for Hyperliquid markets including l2Book (wire-equal to the public feed), l2BookDiff
    (GoldRush-exclusive differential updates), and l4Book (order-level GoldRush-exclusive channel) plus
    wallet firehose, liquidations and vault events, HIP-3 markets, and HIP-4 outcome market streams. Hosted
    at wss://hypercore.goldrushdata.com/ws for ultra-low-latency trading and analytics.
