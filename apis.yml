- name: Authentication
  type: Authentication
  data:
  - id: bearer
    name: Bearer Token
    description: >-
      Send your GoldRush API key as a bearer token in the Authorization header — `Authorization: Bearer
      cqt_xxxxxxxxxxxxxxxxxxxx`. Keys are minted in the GoldRush Platform dashboard.
