description: Covalent provides multi-chain blockchain data infrastructure, published as the GoldRush APIs.
  Its API covers token balances, transactions, transfers, ABIs, NFTs, DeFi positions and cross-chain queries
  across supported networks, including Bitcoin and Hyperliquid.
